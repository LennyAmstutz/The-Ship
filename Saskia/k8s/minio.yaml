# Echtes MinIO (S3) fuer den Analyzer Gamma (Mission 9) - Alternative zu s3_server.py.
# Der Analyzer erwartet es unter http://192.168.101.51:2016, Bucket analyzer-gamma,
# access key theship / secret key theship1234.
#   kubectl apply -f k8s/minio.yaml
# mission_9 erkennt, dass auf Port 2016 schon ein S3-Server laeuft, benutzt diesen
# und legt den Bucket analyzer-gamma selbst an.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              value: theship
            - name: MINIO_ROOT_PASSWORD
              value: theship1234
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 2016
